</head>

<body>

<nav class="navbar">

<div class="auth-page">

    <div class="auth-box">

        <h2>RastelCraft'a Giriş Yap</h2>

        <input
            type="email"
            id="email"
            placeholder="E-posta"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Şifre"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="auth-submit">

<script>

const SUPABASE_URL =
    "https://hoasucytohgdjbircqwv.supabase.co";

const SUPABASE_KEY =

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginButton =
    document.getElementById("loginButton");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const message =
    document.getElementById("message");


loginButton.addEventListener(
    "click",
    async function () {

        const emailValue =
            email.value.trim();

        const passwordValue =
            password.value;


        if (!emailValue || !passwordValue) {

            message.textContent =
                "E-posta ve şifreyi doldur.";

            return;
        }


        loginButton.disabled = true;

        message.textContent =
            "Giriş yapılıyor...";


        const { data, error } =
            await supabaseClient.auth
            .signInWithPassword({

                email: emailValue,

                password: passwordValue

            });


        if (error) {

            message.textContent =
                error.message;

            loginButton.disabled = false;

            return;
        }


        const username =
            data.user.user_metadata?.username;


        message.textContent =
            "Giriş başarılı!";


        setTimeout(
            function () {

                window.location.href =
                    "index.html";

            },
            800
        );

    }
);

</script>
